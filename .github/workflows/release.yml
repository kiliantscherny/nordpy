name: Release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject.toml publishes the wrong version
      # under the right name, and PyPI does not let you take that back.
      - name: Check the tag against the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(uv version --short)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          fi

      - run: uv sync
      - run: uv run pytest

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          # This job installs nothing, so there is no cache to save, and
          # setup-uv's post step fails the job for finding none.
          enable-cache: false
      # No API token anywhere: --trusted-publishing exchanges this job's
      # short-lived OIDC identity for an upload token scoped to this project.
      # --check-url makes a re-run a no-op rather than a duplicate upload.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/nordpy/

  github-release:
    # Only once PyPI has it. A GitHub release for a version nobody can install
    # is worse than no release at all.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          notes=$(awk -v ver="$version" '
            /^## / {
              if (found) exit
              if (index($0, ver)) found=1; next
            }
            found { print }
          ' CHANGELOG.md)
          echo "$notes" > release_notes.md

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --notes-file release_notes.md
