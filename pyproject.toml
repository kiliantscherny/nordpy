[project]
name = "nordpy"
version = "1.4.0"
description = "Interactive TUI for browsing and exporting Nordnet financial data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kilian Tscherny", email = "90620239+kiliantscherny@users.noreply.github.com" }
]
keywords = ["nordnet", "mitid", "denmark", "portfolio", "investing", "tui"]
# An application, not a library. It is meant to be run - `uvx nordpy` - rather
# than imported, and nothing here is a public API.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Danish",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.7.0",
    "duckdb>=1.2.0",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mitid-client>=0.1.2",
    "openpyxl>=3.1.5",
    "pycryptodome>=3.23.0",
    "pydantic>=2.11.0",
    "pyjwt>=2.11.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "textual>=3.1.0",
    "textual-datepicker>=0.2.4",
    "textual-plotext>=0.2.1",
    "yfinance>=0.2.40",
]

[project.urls]
Homepage = "https://github.com/kiliantscherny/nordpy"
Repository = "https://github.com/kiliantscherny/nordpy"
Changelog = "https://github.com/kiliantscherny/nordpy/blob/main/CHANGELOG.md"
Issues = "https://github.com/kiliantscherny/nordpy/issues"

[project.scripts]
nordpy = "nordpy.app:main"

[dependency-groups]
dev = [
    "commitizen>=4.4.0",
    "freezegun>=1.4.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "textual-dev>=1.7.0",
    "tox>=4.36.1",
    "tox-uv>=1.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
