env_list = ["py310", "py311", "py312", "py313", "lint", "typecheck"]

[env_run_base]
description = "Run tests"
dependency_groups = ["dev"]
commands = [["pytest"]]

[env.lint]
description = "Run ruff linter"
skip_install = true
deps = ["ruff>=0.15.0"]
commands = [["ruff", "check", "."]]

[env.typecheck]
description = "Run ty type checker"
# Pin ty (pre-1.0, fast-moving) for reproducible CI. Bump deliberately
# and fix any new findings (errors fail; warnings are non-fatal).
deps = ["ty==0.0.37"]
commands = [["ty", "check"]]
