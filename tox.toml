env_list = ["py310", "py311", "py312", "py313", "lint", "typecheck"]

[env_run_base]
description = "Run tests"
dependency_groups = ["dev"]
commands = [["pytest"]]

[env.lint]
description = "Run ruff linter"
skip_install = true
deps = ["ruff>=0.15.0"]
commands = [["ruff", "check", "."]]

[env.typecheck]
description = "Run ty type checker"
# Pin ty (pre-1.0, fast-moving) for reproducible CI — matches the
# version `uv run ty check` uses locally. Unpinned, tox floated to a
# newer, stricter ty and flagged pre-existing latent issues unrelated
# to current work. Bump deliberately, fixing any new findings.
deps = ["ty==0.0.16"]
commands = [["ty", "check"]]
