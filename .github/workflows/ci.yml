name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=nordpy --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uvx ruff check .

      - name: Type check
        # Pin ty (pre-1.0, fast-moving) for reproducible CI — matches
        # tox.toml and the version `uv run ty check` uses locally.
        # Unpinned, uvx floated to a newer, stricter ty that flagged
        # pre-existing latent issues unrelated to current work.
        run: uvx ty@0.0.16 check
